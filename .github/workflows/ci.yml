name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tui]"

      # Signed scope/consent, keys, local settings and state must never be committed.
      - name: No secrets or local state tracked
        run: |
          tracked=$(git ls-files -- 'config/scope.yaml' 'config/scope.yaml.sig' 'config/settings.yaml' \
            'config/*.local.yaml' 'config/*.pub' '*.key' '*.enc' 'node.key*' '*.sig' '*.consent' \
            'consent.signed' '*_ed25519' '*_ed25519.pub' 'state/' 'var/' 'KILL' '.env' \
            'audit*.log' 'audit*.jsonl')
          if [ -n "$tracked" ]; then
            echo "::error::secret/local files are tracked:"; echo "$tracked"; exit 1
          fi

      - name: Test
        run: python -m pytest -q
