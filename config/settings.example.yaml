# Sentinel-Guard operational settings.
# Copy to config/settings.yaml and edit. Secrets are NEVER stored here — only the
# NAMES of environment variables that hold API keys.

# Master safety switch. Keep true until you have reviewed planned actions.
dry_run: true

ui:
  language: en                  # English only

# Every active capability is opt-in and defaults to false (default-deny).
toggles:
  enable_blocking: false        # install nftables drop rules for attacker IPs
  enable_active_scan: false     # run nmap/nuclei against in-scope hosts
  enable_sandbox_redteam: false # attack validation — ISOLATED SANDBOX ONLY
  enable_patch_apply: false     # apply patches to real hosts (also needs approval)

limits:
  max_targets_per_run: 16
  max_concurrency: 4
  rate_per_minute: 60
  scan_timeout_seconds: 900
  time_window: ""               # e.g. "01:00-05:00" to restrict to a maintenance window

intake:
  log_paths:
    - /var/log/auth.log
  threatintel_api_env:          # provider -> env var holding the key
    abuseipdb: ABUSEIPDB_API_KEY

usage:                          # Claude usage governor (auto model-downgrade/throttle/stop)
  provider: api                 # "api" (metered, daily token budget) | "cli" (subscription)
  daily_token_budget: 1000000   # api only; governor steps down as this fills, resets at midnight
  model_tiers:                  # most -> least capable; governor steps down these
    - claude-opus-4-8
    - claude-sonnet-4-8
    - claude-haiku-4-8
  downgrade_at: 0.60            # budget fraction to downgrade the model
  throttle_at: 0.80             # fraction to quarter the run frequency
  stop_at: 1.0                  # fraction to stop until the daily reset
  base_runs_per_hour: 12

geo:                            # dashboard world map
  home_country: JP              # ISO-3166 alpha-2 of the country you defend from
  home_label: HOME
  enable_geo_lookup: false      # opt-in: resolve attacker-IP countries via a keyless public API
  static_map: {}                # offline overrides {ip: ISO2}, e.g. {"203.0.113.9": "RU"} (checked before the API)

paths:
  scope_file: config/scope.yaml
  scope_sig_file: config/scope.yaml.sig
  scope_pubkey_file: config/scope.pub
  consent_file: config/consent.signed
  consent_pubkey_file: config/consent.pub
  audit_file: state/audit.jsonl
  usage_file: state/usage.jsonl
  killswitch_file: state/KILL
  state_dir: state
